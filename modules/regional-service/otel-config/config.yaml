receivers:
  prometheus:
    config:
      scrape_configs:
      - job_name: "localhost"
        scrape_interval: 10s
        # REPLACE_ME_NATIVE_HISTOGRAMS
        static_configs:
        - targets: [REPLACE_ME_TARGETS]
        # Do not relabel job and instance labels if existed.
        honor_labels: true
        relabel_configs:
          - source_labels: [__address__]
            regex: 'localhost:(\d+)'
            target_label: container_port
            replacement: '$1'
        metric_relabel_configs:
          - source_labels: [ __name__ ]
            regex: '^prometheus_.*'
            action: drop
          # Drop process_* except process_start_time_seconds, which the
          # metricstarttime processor below reads and then drops itself.
          # Relabel regexes are RE2 (no lookahead), so mark the one to keep
          # with a scratch label, drop the unmarked rest, then drop the label.
          # The scratch label uses the reserved __tmp prefix so it can never
          # collide with a label an application exports.
          - source_labels: [ __name__ ]
            regex: 'process_start_time_seconds'
            target_label: __tmp_keep_process_start_time
            replacement: 'true'
          - source_labels: [ __name__, __tmp_keep_process_start_time ]
            regex: 'process_.*;'
            action: drop
          - regex: __tmp_keep_process_start_time
            action: labeldrop
          # REPLACE_ME_GO_METRICS

processors:
  # The prometheus receiver sets no start time on cumulative points, and the
  # googlemanagedprometheus exporter's cumulative normalization then treats the
  # first point it sees for each series as the zero baseline and drops it.
  # Every job execution, and every new service instance, is a fresh process
  # with a fresh collector, so each series' first point is the value at the
  # collector's first scrape — and anything observed before that scrape (a
  # long-mode reconciler's queue wait, recorded as a key is picked up, before
  # the sidecar has booted) is subtracted out and lost.
  # Stamping each point with the process's start time instead gives the first
  # point a real interval, which the exporter passes through whole.
  #
  # The strategy uses the first process_start_time_seconds it finds in a
  # batch, so this runs first in the pipeline, ahead of the batch processor:
  # there, each batch is one scrape of one target. A target that does not
  # export the metric falls back to the collector's start time, which in a
  # sidecar is close to the process's.
  #
  # metricstarttime is the processor's original type name, which v0.142.0
  # (the oldest collector this config supports, for the native histogram
  # scrape keys) requires; later releases renamed it metric_start_time and
  # keep this one as an alias.
  metricstarttime:
    strategy: start_time_metric

  # process_start_time_seconds is kept past the scrape relabeling only for
  # metricstarttime; do not export it. This is the filter processor's
  # legacy metrics.metric form: its replacement, metric_conditions, is newer
  # than v0.142.0, and an unknown key fails collector startup.
  filter/process_start_time:
    error_mode: ignore
    metrics:
      metric:
        - name == "process_start_time_seconds"

  attributes:
    actions:
      - action: insert
        key: team
        value: "REPLACE_ME_TEAM"
      - action: insert
        key: service_name
        value: "REPLACE_ME_NAME"

  batch:
    # batch metrics before sending to reduce API usage
    send_batch_max_size: 200
    send_batch_size: 200
    timeout: 5s

  memory_limiter:
    # drop metrics if memory usage gets too high
    check_interval: 1s
    limit_percentage: 65
    spike_limit_percentage: 20

  # automatically detect Cloud Run resource metadata
  resourcedetection:
    detectors: [env, gcp]

  resource:
    attributes:
    # Add instance_id as a resource attribute, so to avoid race conditions
    # between multiple otel sidecar instance uploading overlapping time series
    # to the same buckets.
    - key: service.instance.id
      from_attribute: faas.instance
      action: upsert
    # The `gcp` resourcedetection processor sets `faas.name` to the name of the
    # Cloud Run service or the Cloud Run job.
    - from_attribute: faas.name
      # The googlemanagedprometheus exporter consumes `service.name` attribute
      # and set the `job` resource label to this value. (See
      # https://github.com/GoogleCloudPlatform/opentelemetry-operations-go/pull/764)
      key: "service.name"
      action: upsert

exporters:
  googlemanagedprometheus:
    project: "REPLACE_ME_PROJECT_ID"
    metric:
      extra_metrics_config:
        # Do not synthesize the otel_scope_info gauge. It is emitted once per
        # scrape TARGET, but unlike scraped series it never gets the
        # per-target container_port label from the relabel above — so on any
        # deployment with more than one metrics target (multiple containers
        # with METRICS_PORT, e.g. a long-mode reconciler job's dispatcher on
        # 2113 beside the reconciler on 2112) the targets' points collide on
        # ONE Managed Prometheus series. GMP rejects the second point each
        # cycle ("written more frequently than the maximum sampling period")
        # and the collector then drops the ENTIRE batch ("Exporting failed.
        # Dropping data."), losing every real metric alongside the
        # informational gauge. Nothing consumes otel_scope_info.
        enable_scope_info: false
    sending_queue:
      enabled: true
      # we are handling metrics for a single pod, no need to have
      # too many senders. this will also avoid out-of-order data.
      num_consumers: 1

extensions:
  health_check:

service:
  telemetry:
    logs:
      # We don't want to see scraper startup logging every
      # cold start.
      level: "error"
      # Stack trace is less useful and break lines.
      disable_stacktrace: true
      encoding: json

  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [metricstarttime, filter/process_start_time, batch, memory_limiter, resourcedetection, resource, attributes]
      exporters: [googlemanagedprometheus]
