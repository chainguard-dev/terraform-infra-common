spec:
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          # Exported commits are signed by the publish workflow. STS policy changes are
          # made directly on the public repo (docs/open-source rule 5); web-UI edits
          # there are signed by GitHub's web-flow key below.
          - subject: https://github.com/chainguard-dev/mono/.github/workflows/open-source-publish.yaml@refs/heads/main
            issuer: https://token.actions.githubusercontent.com
      ctlog:
        url: https://rekor.sigstore.dev
    - key:
        # GitHub's web-flow key. It signs web-UI edits on the public repo
        # (how STS policy changes land) and commits a GitHub App creates through
        # the API.
        kms: https://github.com/web-flow.gpg
